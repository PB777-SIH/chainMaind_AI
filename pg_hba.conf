# PostgreSQL Client Authentication Configuration File
# This file controls which hosts are allowed to connect and how they
# authenticate.

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# local connections using Unix domain sockets
local   all             all                                     trust

# IPv4 local connections (localhost)
host    all             all             127.0.0.1/32            trust

# IPv6 local connections (localhost)
host    all             all             ::1/128                 trust

# replication connections (localhost)
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust

# Remote connections (from Docker host and any external connection)
# Use md5 for wider compatibility
host    all             all             0.0.0.0/0               md5
host    all             all             ::/0                    md5
